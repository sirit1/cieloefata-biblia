<svg viewBox="0 0 400 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rvLogoTitle rvLogoDesc">
  <title id="rvLogoTitle">REVELATIO by Éfata</title>
  <desc id="rvLogoDesc">Emblema vectorial: cruz radiante, árbol de sabiduría, Escrituras abiertas y tipografía editorial en oro sacro.</desc>
  <defs>
    <linearGradient id="sacredGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6E095" />
      <stop offset="25%" stop-color="#E2B747" />
      <stop offset="50%" stop-color="#C59B27" />
      <stop offset="75%" stop-color="#DFB743" />
      <stop offset="100%" stop-color="#9A7418" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(200, 32)">
