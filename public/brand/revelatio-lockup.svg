    <circle cx="0" cy="-6" r="1.5" fill="#FFF8DC" />
    <path d="M-18,-6 L18,-6 M0,-24 L0,12" stroke="url(#sacredGold)" stroke-width="0.75" stroke-dasharray="2,2" opacity="0.6"/>
  </g>

  <g stroke="url(#sacredGold)" stroke-width="1.8" stroke-linecap="round" fill="none">
    <path d="M200, 140 Q200, 95 200, 58" />
    <path d="M200, 115 Q180, 90 170, 70 Q162, 55 175, 45" />
    <path d="M200, 115 Q220, 90 230, 70 Q238, 55 225, 45" />
    <path d="M200, 95 Q185, 75 190, 55" />
    <path d="M200, 95 Q215, 75 210, 55" />
    <circle cx="175" cy="45" r="2.5" fill="url(#sacredGold)" />
    <circle cx="225" cy="45" r="2.5" fill="url(#sacredGold)" />
    <circle cx="190" cy="55" r="2" fill="url(#sacredGold)" />
    <circle cx="210" cy="55" r="2" fill="url(#sacredGold)" />
    <circle cx="170" cy="70" r="1.5" fill="url(#sacredGold)" />
    <circle cx="230" cy="70" r="1.5" fill="url(#sacredGold)" />
  </g>

  <path d="M200, 18 C208, 38 238, 72 238, 102 C238, 126 220, 142 200, 142 C180, 142 162, 126 162, 102 C162, 72 192, 38 200, 18 Z"
        stroke="url(#sacredGold)" stroke-width="2.5" fill="none" opacity="0.85" />

  <path d="M196, 155 Q135, 142 62, 162 C78, 120 128, 78 190, 70 Q188, 115 196, 155 Z"
        fill="none" stroke="url(#sacredGold)" stroke-width="3.5" stroke-linejoin="round" />
  <path d="M192, 165 Q138, 154 75, 172" stroke="url(#sacredGold)" stroke-width="1.8" />
  <path d="M188, 175 Q142, 166 88, 182" stroke="url(#sacredGold)" stroke-width="1.5" opacity="0.7" />

  <path d="M204, 155 Q265, 142 338, 162 C322, 120 272, 78 210, 70 Q212, 115 204, 155 Z"
