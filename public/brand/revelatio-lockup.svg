  <path d="M208, 165 Q262, 154 325, 172" stroke="url(#sacredGold)" stroke-width="1.8" />
  <path d="M212, 175 Q258, 166 312, 182" stroke="url(#sacredGold)" stroke-width="1.5" opacity="0.7" />

  <circle cx="200" cy="180" r="14" fill="#FAF8F5" stroke="url(#sacredGold)" stroke-width="1.8" />
  <text x="200" y="185" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="10" font-weight="bold" fill="url(#sacredGold)" letter-spacing="1.5">‘©</text>

  <text x="200" y="240" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="34" font-weight="700" fill="url(#sacredGold)" letter-spacing="4">REVELATIO</text>
  <text class="rv-logo-by" x="200" y="268" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="16" font-style="italic" fill="#0A192F" letter-spacing="2">by Efata</text>

  <line x1="80" y1="284" x2="160" y2="284" stroke="url(#sacredGold)" stroke-width="0.8" opacity="0.5" />
  <polygon points="200,281 204,284 200,287 196,284" fill="url(#sacredGold)" />
  <line x1="240" y1="284" x2="320" y2="284" stroke="url(#sacredGold)" stroke-width="0.8" opacity="0.5" />

  <text class="rv-logo-lema" x="200" y="306" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#64748B" letter-spacing="1.2">INTELIGENCIA EXEGÉTICA · NEUROPLASTICIDAD · RENOVACIÓN MENTAL</text>
</svg>
