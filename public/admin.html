<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RevelatiO · Administración</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-[#F5EFE3] text-[#2B2417]"><main class="mx-auto max-w-6xl space-y-6 p-6"><header class="flex flex-wrap items-end justify-between gap-4"><div><p class="text-xs uppercase tracking-widest text-[#9A6B12]">Zona privada</p><h1 class="text-3xl font-bold">Panel de administración</h1><p id="user" class="text-sm text-gray-600"></p></div><button id="export" class="rounded-lg bg-[#9A6B12] px-4 py-2 font-bold text-white">Exportar CSV</button></header><p id="error" class="hidden rounded-lg bg-red-100 p-3 text-red-700"></p><section class="grid gap-4 sm:grid-cols-3"><div class="rounded-xl bg-white p-5"><small>Leads captados</small><strong id="count" class="mt-2 block text-3xl">0</strong></div><div class="rounded-xl bg-white p-5"><small>Nuevos</small><strong id="new" class="mt-2 block text-3xl">0</strong></div><div class="rounded-xl bg-white p-5"><small>Campañas</small><strong id="campaigns" class="mt-2 block text-3xl">0</strong></div></section><section class="rounded-xl bg-white p-5"><h2 class="mb-4 text-xl font-bold">Leads</h2><div class="overflow-x-auto"><table class="w-full text-left"><thead><tr><th class="p-2">Nombre</th><th class="p-2">Email</th><th class="p-2">Teléfono</th><th class="p-2">Estado</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>let client,leads=[];async function main(){const c=await fetch('/api/config').then(r=>r.json());client=supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);const s=await client.auth.getSession();const u=s.data.session?.user;if(!u){location.href='/';return}document.querySelector('#user').textContent=u.email;if(u.email.toLowerCase()!=='alejandro.sirit@gmail.com'){document.querySelector('#error').textContent='Acceso restringido al administrador.';document.querySelector('#error').classList.remove('hidden');return}const [a,b]=await Promise.all([client.from('leads').select('*').order('created_at',{ascending:false}),client.from('campaigns').select('id')]);if(a.error){document.querySelector('#error').textContent=a.error.message;document.querySelector('#error').classList.remove('hidden');return}leads=a.data||[];document.querySelector('#count').textContent=leads.length;document.querySelector('#new').textContent=leads.filter(x=>x.status==='new').length;document.querySelector('#campaigns').textContent=(b.data||[]).length;document.querySelector('#rows').innerHTML=leads.map(x=>`<tr class="border-t"><td class="p-2">${x.name||'Sin nombre'}</td><td class="p-2">${x.email||''}</td><td class="p-2">${x.phone||''}</td><td class="p-2">${x.status||''}</td></tr>`).join('')}document.querySelector('#export').onclick=()=>{const csv=['Nombre,Email,Telefono,Estado',...leads.map(x=>[x.name,x.email,x.phone,x.status].map(v=>`"${String(v||'').replaceAll('"','""')}"`).join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='revelatio-leads.csv';a.click()};main()</script></body></html>
