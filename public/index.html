<head>

    <meta name="theme-color" content="#EEF2F4">
    <title>Éfata RevelatiO | Revelación y exégesis de las Escrituras</title>
    <meta name="description"
        content="Organización sin fines de lucro dedicada a la revelación y exégesis de las Escrituras. Estudio bíblico gratuito con comentaristas históricos y RevelatiO IA.">
    <link rel="icon" type="image/png" href="assets/branding/revelatio-pwa-icon.jpg">
    <link rel="apple-touch-icon" href="assets/branding/revelatio-pwa-icon.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body class="flex h-full flex-col">

        <div id="rv-splash" class="rv-splash" role="button" tabindex="0"
        aria-label="Éfata RevelatiO. Toca la pantalla para continuar." aria-modal="true">
        <div class="rv-splash-stage">
            <div class="relative w-full max-w-[340px] sm:max-w-[420px] mx-auto my-6 flex items-center justify-center bg-transparent border-0 shadow-none select-none rv-welcome-logo rv-splash-logo">
              <!-- Halo de resplandor dorado difuso de fondo -->
              <div class="absolute inset-0 bg-[#C59B27]/15 blur-3xl rounded-full pointer-events-none scale-75" aria-hidden="true"></div>

              <!-- Imagen con desvanecimiento radial periférico (0% bordes visibles) -->
              <img
                src="assets/branding/revelatio-logo-master.jpeg"
                alt="Éfata RevelatiO"
                class="relative z-10 w-full h-auto object-contain bg-transparent border-0 shadow-none pointer-events-none"
                style="
                  -webkit-mask-image: radial-gradient(circle at center, rgba(0,0,0,1) 42%, rgba(0,0,0,0.6) 65%, rgba(0,0,0,0) 80%);
                  mask-image: radial-gradient(circle at center, rgba(0,0,0,1) 42%, rgba(0,0,0,0.6) 65%, rgba(0,0,0,0) 80%);
                "
                onerror="this.onerror=null;this.src='assets/branding/revelatio-logo-full-new.jpeg'"
              />
            </div>
            <p class="rv-splash-hint" aria-hidden="true">Toca para continuar</p>
        </div>
    </div>

    <audio id="rv-music" playsinline webkit-playsinline preload="none"></audio>
    <audio id="rv-voice" playsinline webkit-playsinline preload="auto"></audio>
    <audio id="rv-welcome-voice" playsinline webkit-playsinline preload="auto"></audio>

    <!-- Shell: vistas en /views (router). IDs Aposento → views/estudio.html; IA → views/shared-overlays.html -->
    <div id="rv-app" class="rv-app flex min-h-0 flex-1 flex-col" aria-live="polite"></div>
    <div id="rv-overlays"></div>

    <!-- Backdrop modal RevelatiO IA · oculto por defecto (nunca en el flujo del home) -->
    <div id="ai-modal" class="rv-ai-modal-backdrop hidden" style="display: none;" aria-hidden="true" hidden></div>

    <script src="script-principal.js?v=lxxEs1"></script>

    <script src="js/audio-player.js?v=audio1"></script>
    <script src="js/ai-engine.js?v=audio1"></script>
    <script src="js/bible-nav.js?v=lxxEs1"></script>
    <script src="js/verse-actions.js?v=audio1"></script>
    <script type="module" src="js/cards-generator.js?v=lxxEs1"></script>
    <script src="js/services/strongs.js?v=lxxEs1"></script>
    <script src="js/services/study-engine-client.js?v=lxxEs1"></script>
    <script src="js/study-panel.js?v=audio1"></script>
    <script src="js/router.js?v=lxxEs1"></script>
    <script src="js/navigation.js?v=lxxEs1"></script>

    <script src="js/main.js?v=lxxEs1"></script>
    <script type="module" src="js/boot-architecture.js?v=lxxEs1"></script>
    <script type="module" src="js/aposento-mode.js?v=audio1"></script>
