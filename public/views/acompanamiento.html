<div id="rv-acompanamiento" hidden aria-label="Acompañamiento Ministerial">
        <div class="rv-acomp-inner">
            <div class="rv-acomp-head">
                <button type="button" id="btn-volver-acomp"
                    class="rv-btn-gold px-4 py-2 text-[11px] uppercase tracking-[0.18em]">Volver al umbral</button>
                <div class="flex flex-wrap items-center gap-2">
                    <button type="button" data-hub="estudio"
                        class="rv-btn-gold px-4 py-2 text-[11px] uppercase tracking-[0.18em]">Estudio
                        Profundo</button>
                    <div class="rv-ia-badge">
                        <img src="brand/revelatio-mark.png" alt="" class="rv-ia-isotipo">
                        <span class="rv-ia-name">RevelatiO IA</span>
                    </div>
                </div>
            </div>
            <section class="rv-acomp-card">
                <p class="rv-home-kicker">Consejería y restauración</p>
                <h2>Acompañamiento Ministerial</h2>
                <p>Este espacio no ofrece autoayuda ni psicología secular como autoridad. Trae tu carga ante la
                    Escritura: el Padre soberano, la cruz de Cristo y el Espíritu Santo regenerador son el único
                    remedio del corazón de piedra.</p>
                <form id="form-acompanamiento" class="rv-acomp-form">
                    <label class="sr-only" for="acomp-mensaje">Consulta ministerial</label>
                    <textarea id="acomp-mensaje" name="mensaje" required
                        placeholder="Describe con reverencia tu consulta, dolor o necesidad espiritual…"></textarea>
                    <button type="submit" class="rv-btn-fill rv-ia-btn">
                        <img src="brand/revelatio-mark.png" alt="" class="rv-ia-isotipo">
                        <span class="rv-ia-name" style="color:#0a0a0c">Pedir orientación a RevelatiO IA</span>
                    </button>
                </form>
                <div id="rv-acomp-respuesta" role="status" aria-live="polite"></div>
            </section>
        </div>
    </div>
